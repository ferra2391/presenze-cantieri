<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Gestione Presenze - Dashboard Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --primary: hsl(210,100%,45%);
      --primary-dark: hsl(210,100%,35%);
      --text: hsl(210,15%,15%);
      --text-light: hsl(210,10%,40%);
      --muted: hsl(210,8%,50%);
      --bg: hsl(210,25%,96%);
      --card: #ffffff;
      --border: hsl(210,20%,88%);
      --border-strong: hsl(210,20%,75%);
      --orange-weak: hsla(30,100%,50%,0.12);
      --orange-border: hsla(30,100%,50%,0.3);
      --success: hsl(140,70%,40%);
      --error: hsl(0,70%,50%);
      --hover-bg: hsl(210,30%,98%);
      --danger: #c00000;
      --overlay: rgba(0,0,0,.5);

      /* tabella */
      --col-w: 270px;
      --col-op: 210px;
      --day-h: 120px;

      --fs-day: 22px;
      --fs-cantiere: 24px;
      --fs-ore: 23px;
      --fs-tot: 22px;
      --fs-note: 18px;
      --fs-lav: 18px;
    }

    * { box-sizing: border-box; }
    
    html, body { height: 100%; }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 32px 40px;
    }
    
    h1 {
      margin: 0 0 24px;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    /* CONTROL PANEL */
    .control-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      margin-bottom: 28px;
    }
    
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .control-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .nav {
      display: flex;
      gap: 10px;
    }
    
    .nav a {
      padding: 10px 18px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      transition: all 0.2s;
    }
    
    .nav a:hover {
      border-color: var(--primary);
      background: var(--hover-bg);
    }
    
    .nav a.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    
    .nav a.primary:hover {
      background: var(--primary-dark);
    }
    
    input[type="month"] {
      padding: 10px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-size: 15px;
      font-weight: 500;
      min-width: 160px;
      transition: border-color 0.2s;
    }
    
    input[type="month"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    select {
      padding: 10px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    button {
      padding: 10px 18px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s;
      color: var(--text);
    }
    
    button:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--hover-bg);
    }
    
    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    
    button.primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .month-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .spinner {
      display: none;
    }
    
    .spinner.show {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -4px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #status {
      margin-top: 12px;
      font-size: 15px;
    }
    
    .ok {
      color: var(--success);
      font-weight: 600;
    }
    
    .error {
      color: var(--error);
      font-weight: 600;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 600;
    }

    .pill {
      display: inline-block;
      height: 14px;
      width: 24px;
      border-radius: 4px;
      background: var(--orange-weak);
      border: 1px solid var(--orange-border);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    /* TABLE CARDS */
    .matrix-stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      overflow: hidden;
    }
    
    .table-title {
      padding: 20px 24px;
      border-bottom: 2px solid var(--border);
      font-weight: 700;
      font-size: 20px;
      color: var(--text);
      background: linear-gradient(to bottom, var(--card), var(--hover-bg));
    }
    
    .table-wrap {
      overflow-x: auto;
      position: relative;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      font-size: 15px;
    }

    thead th {
      background: var(--hover-bg);
      border-bottom: 2px solid var(--border-strong);
      text-align: center;
      font-weight: 700;
      font-size: var(--fs-day);
      color: var(--text);
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 18px 12px;
      min-width: 160px;
      max-width: 260px;
      white-space: nowrap;
    }

    thead th:first-child {
      left: 0;
      z-index: 3;
      text-align: left;
      padding-left: 20px;
      min-width: var(--col-op);
      max-width: var(--col-op);
      width: var(--col-op);
    }

    thead th.weekend { background: var(--orange-weak); border-color: var(--orange-border); }
    thead th.festivo { background: var(--orange-weak); border-color: var(--orange-border); }
    thead th.day-void { background: #fafafa; color: #ccc; }

    tbody th,
    tbody td {
      border-top: 1px solid var(--border);
      vertical-align: top;
      padding: 0;
      min-height: var(--day-h);
    }

    tbody th {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--card);
      border-right: 2px solid var(--border-strong);
      text-align: left;
      padding: 16px 20px;
      min-width: var(--col-op);
      max-width: var(--col-op);
      width: var(--col-op);
    }

    tbody tr:hover th { background: var(--hover-bg); }

    .op-name {
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .op-total {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
    }

    tbody td {
      min-width: 160px;
      max-width: 260px;
      position: relative;
    }

    tbody td.weekend { background: var(--orange-weak); }
    tbody td.festivo { background: var(--orange-weak); }

    .cell {
      padding: 12px;
      min-height: var(--day-h);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry {
      padding: 10px 12px;
      border-radius: 10px;
      background: linear-gradient(to bottom, #fff, #fafafa);
      border: 2px solid var(--border);
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .entry:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transform: translateY(-1px);
    }

    .entry.assente {
      background: linear-gradient(to bottom, #fee, #fcc);
      border-color: var(--danger);
    }

    .cant {
      font-weight: 700;
      font-size: var(--fs-cantiere);
      color: var(--primary);
      line-height: 1.2;
    }

    .entry.assente .cant { color: var(--danger); }

    .ore {
      font-weight: 700;
      font-size: var(--fs-ore);
      color: var(--text);
    }

    .lav {
      font-size: var(--fs-lav);
      color: var(--text-light);
      line-height: 1.3;
      font-weight: 500;
    }

    .note {
      font-size: var(--fs-note);
      color: var(--muted);
      line-height: 1.3;
      font-style: italic;
    }

    .tot {
      padding: 8px 12px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      font-weight: 700;
      font-size: var(--fs-tot);
      text-align: center;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--day-h);
      font-size: 28px;
      color: var(--muted);
    }

    /* MODALE */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 1000;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      z-index: 1001;
      width: 90%;
      max-width: 600px;
      padding: 32px;
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from { transform: translate(-50%, -48%); opacity: 0; }
      to { transform: translate(-50%, -50%); opacity: 1; }
    }

    #modal h3 {
      margin: 0 0 24px;
      font-size: 24px;
      color: var(--text);
    }

    .modal-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-field label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .modal-field input,
    .modal-field textarea {
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .modal-field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-field input:focus,
    .modal-field textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 2px solid var(--border);
    }

    @media print {
      body { background: white; }
      .control-panel, .nav, button { display: none !important; }
      .table-wrap { overflow: visible !important; }
      thead th:first-child,
      tbody th { position: static !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Gestione Presenze Operai</h1>

    <div class="control-panel">
      <div class="control-row">
        <div class="control-left">
          <button id="prevMonth" class="month-btn" title="Mese precedente">◀</button>
          <input type="month" id="mese" />
          <div id="meseFallback" class="hidden">
            <select id="meseSel">
              <option value="1">Gennaio</option>
              <option value="2">Febbraio</option>
              <option value="3">Marzo</option>
              <option value="4">Aprile</option>
              <option value="5">Maggio</option>
              <option value="6">Giugno</option>
              <option value="7">Luglio</option>
              <option value="8">Agosto</option>
              <option value="9">Settembre</option>
              <option value="10">Ottobre</option>
              <option value="11">Novembre</option>
              <option value="12">Dicembre</option>
            </select>
            <select id="annoSel"></select>
          </div>
          <button id="nextMonth" class="month-btn" title="Mese successivo">▶</button>
          <button id="btnCarica" class="primary">Carica Dati</button>
          <span id="spin" class="spinner"></span>
        </div>
        <div class="nav">
          <a class="primary" href="presenze.html">Presenze</a>
          <a href="operaio.html">Analisi per Operaio</a>
          <a href="cantiere.html">Analisi per Cantiere</a>
        </div>
      </div>

      <div class="control-row" style="margin-top: 16px;">
        <div class="control-left">
          <label class="checkbox-label">
            <input type="checkbox" id="toggleLav" checked>
            <span>Mostra lavorazioni</span>
          </label>
          <button id="btnPDF" title="Esporta PDF A3 orizzontale (testo vettoriale)">📄 PDF A3</button>
          <button id="btnXLS" title="Esporta Excel">📊 Excel</button>
        </div>
      </div>

      <div class="legend">
        <span class="pill"></span>
        <span>Sabato / Domenica / Festivi italiani</span>
      </div>

      <div id="status"></div>
    </div>

    <div class="matrix-stack" id="printArea">
      <div class="table-card" id="cardA">
        <div class="table-title" id="titleA">📆 Giorni 1–15</div>
        <div class="table-wrap">
          <table id="matrixA">
            <thead id="theadA"></thead>
            <tbody id="tbodyA"></tbody>
          </table>
        </div>
      </div>

      <div class="table-card" id="cardB">
        <div class="table-title" id="titleB">📆 Giorni 16–31</div>
        <div class="table-wrap">
          <table id="matrixB">
            <thead id="theadB"></thead>
            <tbody id="tbodyB"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modale -->
  <div id="overlay"></div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">✏️ Modifica Presenza</h3>
    <input type="hidden" id="mod_id">
    
    <div class="modal-row">
      <div class="modal-field">
        <label>Data</label>
        <input type="date" id="mod_data">
      </div>
      <div class="modal-field">
        <label>Ore</label>
        <input type="number" id="mod_ore" step="0.25" min="0" placeholder="es. 8">
      </div>
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label>Cantiere</label>
        <input type="text" id="mod_cantiere" placeholder="Nome cantiere">
      </div>
      <div class="modal-field">
        <label>Lavorazione</label>
        <input type="text" id="mod_lavorazione" placeholder="Descrizione lavorazione">
      </div>
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label>Note</label>
        <textarea id="mod_note" placeholder="Eventuali note"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <button id="btnCancel">Annulla</button>
      <button id="btnSave" class="primary">💾 Salva Modifiche</button>
    </div>
  </div>

  <!-- Librerie -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas rimosso: il PDF ora e vettoriale -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script>
  /* ============ CONFIG & UTIL ============ */
  const SB_URL = 'https://usfpzdxvcexxzraxpjtu.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzZnB6ZHh2Y2V4eHpyYXhwanR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODM3NzYsImV4cCI6MjA5NDE1OTc3Nn0.cWfI8_OGRrE96PPIG1de8Xz1i2RzVK9g40HesqWdvfk';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let CANTIERI = [];
  let UTENTI = [];
  let ROW_BY_ID = new Map();

  const pad = n => String(n).padStart(2,"0");

  const normalize = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();

  function parseDateAny(v){
    if(!v) return null;
    if(v instanceof Date) return v;
    const s = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)){ const [Y,M,D]=s.split("T")[0].split("-").map(Number); return new Date(Y,M-1,D); }
    if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){ const [d,m,y]=s.split(/[ \/]/).map(Number); return new Date(y,m-1,d); }
    const t = new Date(s); return isNaN(t) ? null : t;
  }

  function toISODateInput(d){
    return (d instanceof Date && !isNaN(d)) ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : "";
  }

  function pick(row, ...names){
    if(!row) return "";
    const map = new Map(Object.keys(row).map(k => [normalize(k), k]));
    for(const name of names){
      const key = map.get(normalize(name));
      if(key && row[key] != null && row[key] !== "") return row[key];
    }
    return "";
  }

  const TIME_RANGE_RE = /\b\d{1,2}[:.]\d{2}\s*-\s*\d{1,2}[:.]\d{2}\b/g;
  const stripIntervals = s => s ? String(s).replace(TIME_RANGE_RE,"").replace(/\s{2,}/g," ").trim() : "";

  function calcEaster(Y){
    const a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
          g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,L=(32+2*e+2*i-h-k)%7,
          m=Math.floor((a+11*h+22*L)/451),month=Math.floor((h+L-7*m+114)/31),day=((h+L-7*m+114)%31)+1;
    return new Date(Y,month-1,day);
  }

  function italianHolidays(year){
    const set=new Set(),add=(m,d)=>set.add(`${year}-${pad(m)}-${pad(d)}`);
    add(1,1); add(1,6); add(4,25); add(5,1); add(6,2); add(8,15); add(11,1); add(12,8); add(12,25); add(12,26);
    const p=calcEaster(year), q=new Date(p); q.setDate(p.getDate()+1);
    add(p.getMonth()+1,p.getDate()); add(q.getMonth()+1,q.getDate());
    return set;
  }

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text!=null) n.textContent = String(text);
    return n;
  }

  async function loadCantieri(){
    const { data, error } = await sb.from('cantieri').select('id,nome,attivo').order('nome');
    if(error) throw error;
    CANTIERI = data || [];
  }

  async function loadUtenti(){
    const { data, error } = await sb.from('utenti').select('id,nome,cognome,user_code,attivo').order('nome');
    if(error) throw error;
    UTENTI = data || [];
  }

  function userNameById(id){
    const u = UTENTI.find(x => String(x.id) === String(id));
    return [u?.nome, u?.cognome].filter(Boolean).join(' ').trim();
  }

  function cantiereNameById(id){
    const c = CANTIERI.find(x => String(x.id) === String(id));
    return c?.nome || '';
  }

  function cantiereIdByName(name){
    const n = normalize(name);
    const found = CANTIERI.find(c => normalize(c.nome) === n);
    return found?.id || null;
  }

  function normalizeTimeDisplay(s){
    return String(s || '').replace(/(\d{2}:\d{2}):\d{2}/g, '$1');
  }

  async function fetchRowsFromServer(year, month){
    const from = `${year}-${pad(month)}-01`;
    const toDate = new Date(year, month, 1);
    const to = `${toDate.getFullYear()}-${pad(toDate.getMonth()+1)}-01`;

    await Promise.all([loadCantieri(), loadUtenti()]);

    let { data, error } = await sb.from('presenze')
      .select('id,data_presenza,utente_id,cantiere_id,lavorazione,orari_display,ore,is_assente,note,created_at,utenti(nome,cognome,user_code),cantieri(nome)')
      .gte('data_presenza', from)
      .lt('data_presenza', to)
      .order('data_presenza', { ascending: true })
      .order('created_at', { ascending: true });

    if(error){
      const r2 = await sb.from('presenze')
        .select('id,data_presenza,utente_id,cantiere_id,lavorazione,orari_display,ore,is_assente,note,created_at')
        .gte('data_presenza', from)
        .lt('data_presenza', to)
        .order('data_presenza', { ascending: true })
        .order('created_at', { ascending: true });
      if(r2.error) throw r2.error;
      data = r2.data || [];
    }

    return (data || []).map(r => {
      const u = Array.isArray(r.utenti) ? r.utenti[0] : r.utenti;
      const c = Array.isArray(r.cantieri) ? r.cantieri[0] : r.cantieri;
      const operaio = [u?.nome, u?.cognome].filter(Boolean).join(' ').trim() || userNameById(r.utente_id) || r.utente_id;
      const cantiere = r.is_assente ? 'ASSENTE' : (c?.nome || cantiereNameById(r.cantiere_id) || r.cantiere_id);
      return {
        id: r.id,
        data: r.data_presenza,
        operaio,
        cantiere,
        cantiere_id: r.cantiere_id,
        ore: r.ore,
        lavorazione: r.lavorazione || '',
        orari: normalizeTimeDisplay(r.orari_display || ''),
        note: r.note || '',
        is_assente: !!r.is_assente
      };
    });
  }

  /* ============ MESE & RENDER ============ */
  const meseInput   = document.getElementById("mese");
  const meseFallback= document.getElementById("meseFallback");
  const selMese     = document.getElementById("meseSel");
  const selAnno     = document.getElementById("annoSel");
  const prevBtn     = document.getElementById("prevMonth");
  const nextBtn     = document.getElementById("nextMonth");
  const btnCarica   = document.getElementById("btnCarica");
  const spin        = document.getElementById("spin");
  const statusEl    = document.getElementById("status");
  const titleA      = document.getElementById("titleA");
  const titleB      = document.getElementById("titleB");

  const supportsMonth = (() => { const i=document.createElement('input'); i.type='month'; return i.type === 'month'; })();

  function populateYearSelect(baseYear){
    selAnno.innerHTML = "";
    for(let y=baseYear-4; y<=baseYear+2; y++){
      const opt=document.createElement('option');
      opt.value=String(y); opt.textContent=String(y);
      selAnno.appendChild(opt);
    }
  }

  function setYM(Y,M,updateControls=true){
    const val = `${Y}-${pad(M)}`;
    if(supportsMonth){ meseInput.value = val; }
    if(updateControls){ selAnno.value = String(Y); selMese.value = String(M); }
    const monthName = new Date(Y, M-1, 1).toLocaleString('it-IT',{month:'long', year:'numeric'});
    titleA.textContent = `📆 Giorni 1–15 — ${monthName}`;
    titleB.textContent = `📆 Giorni 16–31 — ${monthName}`;
  }

  function getYM(){
    if(supportsMonth){
      const v = meseInput.value;
      if(v && /^\d{4}-\d{2}$/.test(v)){ const [Y,M] = v.split('-').map(Number); return [Y,M]; }
    }
    return [Number(selAnno.value), Number(selMese.value)];
  }

  function shiftMonth(delta){
    let [Y,M] = getYM();
    M += delta;
    if(M<1){ M=12; Y--; }
    if(M>12){ M=1; Y++; }
    setYM(Y,M,true);
    carica();
  }

  function renderHeaderHalf(containerTheadId, year, month, startDay, endDay){
    const thead = document.getElementById(containerTheadId);
    thead.innerHTML = "";
    const tr = document.createElement("tr");

    const th0 = document.createElement("th");
    th0.textContent = "Operaio";
    th0.style.textAlign = "left";
    tr.appendChild(th0);

    const daysInMonth = new Date(year, month, 0).getDate();
    const holidays = italianHolidays(year);

    for(let d=startDay; d<=endDay; d++){
      const th = document.createElement("th");
      th.textContent = d;
      th.title = `${pad(d)}/${pad(month)}/${year}`;
      if(d > daysInMonth){
        th.classList.add("day-void");
      }else{
        const dow = (new Date(year, month-1, d).getDay()+6)%7;
        const iso = `${year}-${pad(month)}-${pad(d)}`;
        if(dow===5 || dow===6) th.classList.add("weekend");
        if(holidays.has(iso)) th.classList.add("festivo");
      }
      tr.appendChild(th);
    }
    thead.appendChild(tr);
  }

  let SHOW_LAV = true;
  const toggleLav = document.getElementById('toggleLav');
  toggleLav.addEventListener('change', ()=>{
    SHOW_LAV = toggleLav.checked;
    if(cache.operai.length){
      renderBodyHalf("tbodyA", cache.Y, cache.M, 1, 15, cache.operai, cache.byOpDay);
      renderBodyHalf("tbodyB", cache.Y, cache.M, 16, 31, cache.operai, cache.byOpDay);
    }
  });

  const cache = { Y:null, M:null, operai:[], byOpDay:{} };

  function renderBodyHalf(containerTbodyId, year, month, startDay, endDay, operai, byOpDay){
    const tbody = document.getElementById(containerTbodyId);
    tbody.innerHTML = "";
    const daysInMonth = new Date(year, month, 0).getDate();
    const holidays = italianHolidays(year);

    operai.forEach(op=>{
      const tr = document.createElement("tr");
      const th = document.createElement("th");

      // Somma ore mese
      let monthTotal = 0;
      const daysMap = byOpDay[op] || {};
      Object.values(daysMap).forEach(arr=>{
        arr.forEach(en=>{
          if(en.ore != null && !isNaN(en.ore)) monthTotal += Number(en.ore);
        });
      });
      const monthTotalTxt = (+monthTotal.toFixed(2)).toString();

      th.innerHTML = `
        <div class="op-name">${op}</div>
        <div class="op-total">ORE MESE: ${monthTotalTxt} h</div>
      `;
      tr.appendChild(th);

      for(let d=startDay; d<=endDay; d++){
        const td = document.createElement("td");

        if(d <= daysInMonth){
          const dow = (new Date(year, month-1, d).getDay()+6)%7;
          const iso = `${year}-${pad(month)}-${pad(d)}`;
          if(dow===5 || dow===6) td.classList.add("weekend");
          if(holidays.has(iso)) td.classList.add("festivo");

          const entries = (byOpDay[op] && byOpDay[op][d]) ? byOpDay[op][d] : [];

          const inner = document.createElement('div');
          inner.className = 'cell';

          if(entries.length){
            let total = 0;
            entries.forEach(en=>{
              const wrap = document.createElement("div");
              wrap.className = "entry";
              wrap.title = "Clicca per modificare";
              wrap.addEventListener('click', ()=> openEdit(en.id));

              const cantiereRaw = en.cantiere != null ? String(en.cantiere) : "";
              const cantDisplay  = cantiereRaw.trim().toUpperCase();
              if (cantDisplay === "ASSENTE") wrap.classList.add("assente");

              const oreTxt = (en.ore!=null && !isNaN(en.ore)) ? `${en.ore} h` : "";
              const lav    = en.lavorazione || "";
              const orari  = en.orari || "";
              const note   = en.note || "";

              // Mostra
              wrap.appendChild(el('div','cant', cantDisplay || ''));
              if (oreTxt) wrap.appendChild(el('div','ore',  oreTxt));
              if (SHOW_LAV && lav) wrap.appendChild(el('div','lav',  lav));

              // Orari (+ note SOLO se diverse dall'orario)
              if (orari || note){
                let line = orari;
                const nt = note.trim();
                if (nt && nt !== "-" && nt !== "—" && nt !== "." && nt !== "·" && nt !== line.trim()){
                  line = line ? (line + " — " + nt) : nt;
                }
                wrap.appendChild(el('div','note', line));
              }

              inner.appendChild(wrap);
              if(en.ore!=null && !isNaN(en.ore)) total += Number(en.ore);
            });
            if(entries.length>1){
              const tot = document.createElement("div");
              tot.className = "tot";
              tot.textContent = `Tot: ${(+total.toFixed(2)).toString()} h`;
              inner.appendChild(tot);
            }
          }else{
            inner.innerHTML = `<div class="center">—</div>`;
          }

          td.appendChild(inner);
        }else{
          td.style.background = "#fafafa";
        }
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });

    if(operai.length===0){
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = (endDay-startDay+1) + 1;
      td.className = "center";
      td.style.padding = "48px";
      td.innerHTML = `<span class="error">Nessun operaio trovato per questo mese.</span>`;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function setLoading(on){
    spin.classList.toggle("show", !!on);
    btnCarica.disabled = !!on;
    prevBtn.disabled = !!on;
    nextBtn.disabled = !!on;
  }

  async function carica(){
    try{
      setLoading(true);
      statusEl.textContent = "";

      const [Y,M] = getYM();
      if(!Y || !M){
        statusEl.innerHTML = `<span class="error">⚠️ Seleziona un mese valido</span>`;
        return;
      }

      const rows = await fetchRowsFromServer(Y, M);
      ROW_BY_ID = new Map(rows.map(r => [String(r.id), r]));

      const byOpDay = {};
      rows.forEach(r=>{
        const dt = parseDateAny(r.data);
        if(!dt) return;
        const op = String(r.operaio || "").trim();
        if(!op) return;
        const d = dt.getDate();

        byOpDay[op] ??= {};
        byOpDay[op][d] ??= [];
        byOpDay[op][d].push({
          id: r.id,
          data: r.data,
          cantiere: r.cantiere,
          cantiere_id: r.cantiere_id,
          ore: r.ore,
          lavorazione: r.lavorazione,
          orari: r.orari,
          note: r.note,
          is_assente: r.is_assente
        });
      });

      let operai = Object.keys(byOpDay).sort((a,b)=>a.localeCompare(b,'it'));

      renderHeaderHalf("theadA", Y, M, 1, 15);
      renderHeaderHalf("theadB", Y, M, 16, 31);

      cache.Y = Y; cache.M = M; cache.operai = operai; cache.byOpDay = byOpDay;

      renderBodyHalf("tbodyA", Y, M, 1, 15, operai, byOpDay);
      renderBodyHalf("tbodyB", Y, M, 16, 31, operai, byOpDay);

      statusEl.innerHTML = `<span class="ok">✓ Dati caricati dal server (${rows.length} presenze)</span>`;
    }catch(err){
      console.error(err);
      statusEl.innerHTML = `<span class="error">✗ Errore nel caricamento dati: ${err.message}</span>`;
    }finally{
      setLoading(false);
    }
  }

  /* ============ MODALE ============ */
  const overlay = document.getElementById('overlay');
  const modal   = document.getElementById('modal');
  const modId   = document.getElementById('mod_id');
  const modData = document.getElementById('mod_data');
  const modOre  = document.getElementById('mod_ore');

  async function openEdit(id){
    let obj = ROW_BY_ID.get(String(id));
    if(!obj){
      const { data, error } = await sb.from('presenze')
        .select('id,data_presenza,cantiere_id,lavorazione,ore,note,is_assente,cantieri(nome)')
        .eq('id', id)
        .maybeSingle();
      if(error){ alert('Errore lettura presenza: ' + error.message); return; }
      const c = Array.isArray(data?.cantieri) ? data.cantieri[0] : data?.cantieri;
      obj = {
        id: data.id,
        data: data.data_presenza,
        cantiere_id: data.cantiere_id,
        cantiere: data.is_assente ? 'ASSENTE' : (c?.nome || cantiereNameById(data.cantiere_id)),
        ore: data.ore,
        lavorazione: data.lavorazione,
        note: data.note || ''
      };
    }

    modId.value = obj.id || id;
    modData.value = toISODateInput(parseDateAny(obj.data));
    modOre.value  = (obj.ore!=null && !isNaN(obj.ore)) ? obj.ore : "";
    modCant.value = obj.cantiere || "";
    modLav.value  = obj.lavorazione || "";
    modNote.value = obj.note || "";
    overlay.style.display='block';
    modal.style.display='block';
  }

  function closeEdit(){
    modal.style.display='none';
    overlay.style.display='none';
  }

  document.getElementById('btnCancel').addEventListener('click', closeEdit);
  overlay.addEventListener('click', closeEdit);
  window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeEdit(); });

  document.getElementById('btnSave').addEventListener('click', async ()=>{
    try{
      const id = String(modId.value || "").trim();
      if(!id){ alert('ID presenza mancante.'); return; }

      const cantText = String(modCant.value || '').trim();
      let cantiereId = cantiereIdByName(cantText);
      const isAssente = normalize(cantText) === 'assente';
      if(isAssente){
        cantiereId = cantiereIdByName('ASSENTE') || cantiereId;
      }
      if(!cantiereId){
        alert('Cantiere non trovato. Scrivi il nome esattamente come presente nell’elenco cantieri.');
        return;
      }

      const ore = modOre.value === '' ? 0 : Number(String(modOre.value).replace(',', '.'));
      if(isNaN(ore)){ alert('Ore non valide.'); return; }

      const payload = {
        data_presenza: modData.value || null,
        cantiere_id: cantiereId,
        lavorazione: modLav.value || (isAssente ? 'ASSENTE' : ''),
        ore,
        note: modNote.value || null,
        is_assente: isAssente,
        updated_at: new Date().toISOString()

      const { error } = await sb.from('presenze').update(payload).eq('id', id);
      if(error) throw error;

      closeEdit();
      statusEl.innerHTML = '<span class="ok">✓ Modifiche salvate. Ricarico...</span>';
      await carica();

      console.error(err);
      alert('Errore durante il salvataggio: ' + (err.message || err));

  });

  /* ============ EXPORT PDF A3 - VETTORIALE ============ */
  /* Nessuno screenshot: il PDF viene disegnato come testo vero.
     Risultato: nitido a qualsiasi zoom, selezionabile, file leggero. */

  const PDF_MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio',
                    'Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const PDF_DOW  = ['LUN','MAR','MER','GIO','VEN','SAB','DOM'];

  /* rimuove emoji e caratteri che i font standard del PDF non sanno rendere */
  function pdfClean(s){
    return String(s == null ? '' : s)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}]/gu, '')
      .replace(/[\u2018\u2019]/g, "'")
      .replace(/[\u201C\u201D]/g, '"')
      .replace(/[\u2013\u2014]/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
  }

  async function ensurePdfLibs(){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
      });
    }
  }

  function buildPresenzePDF(jsPDF, cache, opts){
    opts = opts || {};
    const SHOW_LAV = opts.showLav !== false;

    if(!cache || !cache.operai || !cache.operai.length)
      throw new Error('Nessun dato caricato: premi prima "Carica Dati".');
    const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a3', compress:true});
    const PW = doc.internal.pageSize.getWidth();
    const PH = doc.internal.pageSize.getHeight();

    /* ---------- palette ---------- */
    const C = {
      text:[33,40,49], light:[92,102,112], muted:[117,128,138],
      blue:[0,105,205], blueDark:[0,72,150],
      border:[214,221,229], borderStrong:[168,181,195],
      weekend:[255,241,222], weekendLine:[240,205,160],
      entryBg:[244,248,252], entryLine:[213,227,240],
      assBg:[253,232,232], assLine:[240,190,190], danger:[176,0,0],
      headBg:[236,241,247], white:[255,255,255],
      zebra:[250,251,253]
    };

    /* ---------- geometria ---------- */
    const M = {l:18, r:18, t:50, b:24};
    const COL_OP  = 108;
    const MIN_COL = SHOW_LAV ? 130 : 74;

    const Y = cache.Y, MM = cache.M;
    const daysInMonth = new Date(Y, MM, 0).getDate();
    const holidays = italianHolidays(Y);

    const usableW = PW - M.l - M.r - COL_OP;
    let perPage = Math.max(1, Math.floor(usableW / MIN_COL));
    perPage = Math.min(perPage, daysInMonth);
    const nChunks = Math.ceil(daysInMonth / perPage);
    perPage = Math.ceil(daysInMonth / nChunks);
    const COL_W = usableW / perPage;

    /* ---------- tipografia ---------- */
    const FS = {cant:7.4, ore:7.4, lav:6.4, meta:5.9, tot:6.6,
                day:10, dow:6, op:7.6, opTot:6.2, title:12, foot:7};
    const LH = f => f * 1.17;

    const PAD    = 3.2;   // padding cella
    const EPAD   = 2.4;   // padding interno entry
    const EGAP   = 2.4;   // spazio tra entry
    const HEAD_H = 26;
    const ROW_MIN= 24;
    const MAX_LAV_LINES  = 5;
    const MAX_META_LINES = 3;

    const pad2 = n => String(n).padStart(2,'0');
    const isoOf = d => `${Y}-${pad2(MM)}-${pad2(d)}`;
    const dowOf = d => (new Date(Y, MM-1, d).getDay()+6)%7;
    const isRed = d => { const w=dowOf(d); return w===5 || w===6 || holidays.has(isoOf(d)); };

    /* ---------- costruzione contenuto cella ---------- */
    function wrap(txt, w, size, style){
      doc.setFont('helvetica', style || 'normal');
      doc.setFontSize(size);
      return doc.splitTextToSize(txt, w);
    }

    function buildCell(entries, innerW){
      if(!entries || !entries.length) return {blocks:[], tot:null, h:ROW_MIN};
      const blocks = [];
      let total = 0, nOre = 0;

      entries.forEach(en=>{
        let cant = pdfClean(en.cantiere).toUpperCase();
        if(cant.startsWith('ALTRO')) cant = 'ALTRO';
        const ass  = (en.is_assente === true) || cant === 'ASSENTE';
        const oreTxt = (en.ore!=null && !isNaN(en.ore)) ? `${+Number(en.ore).toFixed(2)} h` : '';
        if(en.ore!=null && !isNaN(en.ore)){ total += Number(en.ore); nOre++; }

        doc.setFont('helvetica','bold'); doc.setFontSize(FS.ore);
        const oreW = oreTxt ? doc.getTextWidth(oreTxt) + 4 : 0;
        const cantLines = wrap(cant, Math.max(20, innerW - 2*EPAD - oreW), FS.cant, 'bold').slice(0,2);

        let lavLines = [];
        if(SHOW_LAV && pdfClean(en.lavorazione))
          lavLines = wrap(pdfClean(en.lavorazione), innerW - 2*EPAD, FS.lav, 'normal').slice(0, MAX_LAV_LINES);

        // orari + nota (nota solo se aggiunge informazione)
        let meta = pdfClean(en.orari);
        const nt = pdfClean(en.note);
        if(nt && nt!=='-' && nt!=='.' && nt!==meta) meta = meta ? (meta + ' - ' + nt) : nt;
        let metaLines = meta ? wrap(meta, innerW - 2*EPAD, FS.meta, 'italic').slice(0, MAX_META_LINES) : [];

        const h = EPAD*2
                + cantLines.length*LH(FS.cant)
                + lavLines.length*LH(FS.lav)
                + metaLines.length*LH(FS.meta);

        blocks.push({cantLines, oreTxt, lavLines, metaLines, ass, h});
      });

      const tot = (blocks.length>1 && nOre>0) ? `Tot: ${+total.toFixed(2)} h` : null;
      let h = PAD*2 + blocks.reduce((a,b)=>a+b.h,0) + EGAP*(blocks.length-1);
      if(tot) h += LH(FS.tot) + 1;
      return {blocks, tot, h:Math.max(ROW_MIN, h)};
    }

    /* ---------- disegno cella ---------- */
    function drawCell(cell, x, y, w){
      let cy = y + PAD;
      cell.blocks.forEach(b=>{
        doc.setFillColor(...(b.ass ? C.assBg : C.entryBg));
        doc.setDrawColor(...(b.ass ? C.assLine : C.entryLine));
        doc.setLineWidth(0.4);
        doc.roundedRect(x+2, cy, w-4, b.h, 1.6, 1.6, 'FD');

        let ty = cy + EPAD + LH(FS.cant)*0.78;

        if(b.oreTxt){
          doc.setFont('helvetica','bold'); doc.setFontSize(FS.ore);
          doc.setTextColor(...(b.ass ? C.danger : C.blueDark));
          doc.text(b.oreTxt, x+w-2-EPAD, ty, {align:'right'});
        }
        doc.setFont('helvetica','bold'); doc.setFontSize(FS.cant);
        doc.setTextColor(...(b.ass ? C.danger : C.text));
        b.cantLines.forEach((ln,i)=>{ doc.text(ln, x+2+EPAD, ty + i*LH(FS.cant)); });
        ty += b.cantLines.length*LH(FS.cant);

        if(b.lavLines.length){
          doc.setFont('helvetica','normal'); doc.setFontSize(FS.lav);
          doc.setTextColor(...C.light);
          b.lavLines.forEach((ln,i)=>{ doc.text(ln, x+2+EPAD, ty + i*LH(FS.lav)); });
          ty += b.lavLines.length*LH(FS.lav);
        }
        if(b.metaLines.length){
          doc.setFont('helvetica','italic'); doc.setFontSize(FS.meta);
          doc.setTextColor(...C.muted);
          b.metaLines.forEach((ln,i)=>{ doc.text(ln, x+2+EPAD, ty + i*LH(FS.meta)); });
        }
        cy += b.h + EGAP;
      });

      if(cell.tot){
        doc.setFont('helvetica','bold'); doc.setFontSize(FS.tot);
        doc.setTextColor(...C.blue);
        doc.text(cell.tot, x+w-2-EPAD, cy + LH(FS.tot)*0.72, {align:'right'});
      }
      if(!cell.blocks.length){
        doc.setFont('helvetica','normal'); doc.setFontSize(FS.lav);
        doc.setTextColor(215,220,226);
        doc.text('-', x + w/2, y + 14, {align:'center'});
      }
    }

    /* ---------- totale mese per operaio ---------- */
    const monthTot = {};
    cache.operai.forEach(op=>{
      let t=0;
      const dm = cache.byOpDay[op] || {};
      Object.keys(dm).forEach(d=> dm[d].forEach(en=>{
        if(en.ore!=null && !isNaN(en.ore)) t += Number(en.ore);
      }));
      monthTot[op] = +t.toFixed(2);
    });

    /* ---------- chunk dei giorni ---------- */
    const chunks = [];
    for(let s=1; s<=daysInMonth; s+=perPage){
      const from = s, to = Math.min(s+perPage-1, daysInMonth);
      chunks.push({from, to, colW: usableW / (to - from + 1)});
    }

    /* ---------- pre-calcolo altezze e impaginazione ---------- */
    const pages = [];
    chunks.forEach(ch=>{
      const rows = cache.operai.map(op=>{
        const cells = [];
        let h = ROW_MIN;
        for(let d=ch.from; d<=ch.to; d++){
          const en = (cache.byOpDay[op] && cache.byOpDay[op][d]) || (cache.byOpDay[op] && cache.byOpDay[op][String(d)]) || [];
          const c = buildCell(en, ch.colW);
          cells.push(c);
          if(c.h > h) h = c.h;
        }
        return {op, cells, h};
      });

      const availH = PH - M.t - M.b - HEAD_H;
      const totalH = rows.reduce((a,r)=>a+r.h, 0);
      const nPg    = Math.max(1, Math.ceil(totalH / availH));
      const target = totalH / nPg;              // bilancia le pagine del chunk
      let cur = [], curH = 0, made = 0;
      rows.forEach(r=>{
        const wouldOverflow = curH + r.h > availH;
        const pastTarget    = curH >= target && made < nPg-1;
        if(cur.length && (wouldOverflow || pastTarget)){
          pages.push({ch, rows:cur}); made++; cur=[]; curH=0;
        }
        cur.push(r); curH += r.h;
      });
      if(cur.length) pages.push({ch, rows:cur});
    });

    /* ---------- rendering ---------- */
    pages.forEach((pg, pi)=>{
      if(pi) doc.addPage();
      const {ch, rows} = pg;
      const nDays  = ch.to - ch.from + 1;
      const COL_W  = ch.colW;
      const tableW = COL_OP + nDays*COL_W;
      const bodyH = rows.reduce((a,r)=>a+r.h, 0);

      /* titolo */
      doc.setFont('helvetica','bold'); doc.setFontSize(FS.title);
      doc.setTextColor(...C.blueDark);
      const titolo = `PRESENZE ${PDF_MESI[MM-1].toUpperCase()} ${Y}`;
      doc.text(titolo, M.l, 24);
      const titW = doc.getTextWidth(titolo);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.setTextColor(...C.light);
      doc.text(`giorni ${ch.from} - ${ch.to} di ${daysInMonth}`, M.l + titW + 14, 24);
      doc.setFontSize(FS.foot);
      doc.text(`pagina ${pi+1} di ${pages.length}`, PW - M.r, 24, {align:'right'});
      doc.setDrawColor(...C.borderStrong); doc.setLineWidth(0.7);
      doc.line(M.l, 30, PW - M.r, 30);

      /* zebra a tutta riga (sotto a tutto) */
      let zy = M.t + HEAD_H;
      rows.forEach((r, ri)=>{
        if(ri % 2 === 1){ doc.setFillColor(...C.zebra); doc.rect(M.l, zy, tableW, r.h, 'F'); }
        zy += r.h;
      });

      /* fondo colonne weekend/festivi */
      for(let d=ch.from; d<=ch.to; d++){
        if(!isRed(d)) continue;
        const x = M.l + COL_OP + (d-ch.from)*COL_W;
        doc.setFillColor(...C.weekend);
        doc.rect(x, M.t, COL_W, HEAD_H + bodyH, 'F');
      }

      /* header */
      doc.setFillColor(...C.headBg);
      doc.rect(M.l, M.t, COL_OP, HEAD_H, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(FS.op);
      doc.setTextColor(...C.blueDark);
      doc.text('OPERAIO', M.l + 5, M.t + 16);

      for(let d=ch.from; d<=ch.to; d++){
        const x = M.l + COL_OP + (d-ch.from)*COL_W;
        if(!isRed(d)){ doc.setFillColor(...C.headBg); doc.rect(x, M.t, COL_W, HEAD_H, 'F'); }
        const red = isRed(d);
        doc.setFont('helvetica','bold'); doc.setFontSize(FS.day);
        const wNum = doc.getTextWidth(String(d));
        doc.setFont('helvetica','bold'); doc.setFontSize(FS.dow);
        const wDow = doc.getTextWidth(PDF_DOW[dowOf(d)]);
        const x0 = x + (COL_W - (wNum + 4 + wDow))/2;
        doc.setFontSize(FS.day);
        doc.setTextColor(...(red ? C.danger : C.blueDark));
        doc.text(String(d), x0, M.t + 17);
        doc.setFontSize(FS.dow);
        doc.setTextColor(...(red ? C.danger : C.muted));
        doc.text(PDF_DOW[dowOf(d)], x0 + wNum + 4, M.t + 17);
      }

      /* righe */
      let y = M.t + HEAD_H;
      rows.forEach((r, ri)=>{
        doc.setFont('helvetica','bold'); doc.setFontSize(FS.op);
        doc.setTextColor(...C.text);
        const nameLines = wrap(pdfClean(r.op), COL_OP - 10, FS.op, 'bold').slice(0,3);
        nameLines.forEach((ln,i)=> doc.text(ln, M.l + 5, y + 11 + i*LH(FS.op)));
        doc.setFont('helvetica','normal'); doc.setFontSize(FS.opTot);
        doc.setTextColor(...C.blue);
        doc.text(`ORE MESE: ${monthTot[r.op]} h`, M.l + 5, y + 11 + nameLines.length*LH(FS.op) + 2);

        r.cells.forEach((c, ci)=>{
          drawCell(c, M.l + COL_OP + ci*COL_W, y, COL_W);
        });

        y += r.h;
        doc.setDrawColor(...C.border); doc.setLineWidth(0.5);
        doc.line(M.l, y, M.l + tableW, y);
      });

      /* griglia verticale + cornice */
      doc.setDrawColor(...C.border); doc.setLineWidth(0.5);
      for(let i=0; i<=nDays; i++){
        const x = M.l + COL_OP + i*COL_W;
        doc.line(x, M.t, x, M.t + HEAD_H + bodyH);
      }
      doc.setDrawColor(...C.borderStrong); doc.setLineWidth(0.9);
      doc.rect(M.l, M.t, tableW, HEAD_H + bodyH);
      doc.line(M.l, M.t + HEAD_H, M.l + tableW, M.t + HEAD_H);
      doc.line(M.l + COL_OP, M.t, M.l + COL_OP, M.t + HEAD_H + bodyH);

      /* footer */
      doc.setFont('helvetica','normal'); doc.setFontSize(FS.foot);
      doc.setTextColor(...C.muted);
      doc.text('Sfondo arancio = sabato / domenica / festivi italiani', M.l, PH - 10);
    });

    return doc;
  }

  async function exportPDF(){
    try{
      await ensurePdfLibs();
      statusEl.innerHTML = '<span class="ok">Generazione PDF in corso...</span>';
      await new Promise(r=>setTimeout(r,30));

      const { jsPDF } = window.jspdf;
      const doc = buildPresenzePDF(jsPDF, cache, { showLav: SHOW_LAV });

      doc.save(`Presenze_${cache.Y}-${pad(cache.M)}.pdf`);

      const n = doc.internal.getNumberOfPages();
      statusEl.innerHTML = `<span class="ok">PDF esportato: ${n} pagine A3 orizzontali</span>`;
      setTimeout(() => statusEl.textContent = '', 4000);
    }catch(e){
      console.error(e);
      alert('Export PDF fallito: ' + (e && e.message ? e.message : e));
      statusEl.innerHTML = '<span class="error">Errore durante l\'export PDF</span>';
    }
  }

  /* ============ EXCEL EXPORT ============ */
  function xmlEscape(s){
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&apos;");
  }

  function buildMatrix(startDay, endDay){
    const Y = cache.Y, M = cache.M;
    const daysInMonth = new Date(Y, M, 0).getDate();
    const holidays = italianHolidays(Y);
    const header = ["Operaio"];
    for(let d=startDay; d<=endDay; d++){
      header.push(d <= daysInMonth ? String(d) : "");
    }
    const rows = [header];

    cache.operai.forEach(op=>{
      const line = [op];
      for(let d=startDay; d<=endDay; d++){
        if(d>daysInMonth){ line.push(""); continue; }
        const entries = (cache.byOpDay[op] && cache.byOpDay[op][d]) ? cache.byOpDay[op][d] : [];
        if(!entries.length){ line.push("—"); continue; }

        let total=0;
        const parts=[];
        entries.forEach(en=>{
          const chunks=[];
          const cantDisp = (en.cantiere||"").toString().toUpperCase();
          if(cantDisp) chunks.push(cantDisp);
          if(en.ore!=null && !isNaN(en.ore)){ chunks.push(`${en.ore} h`); total+=Number(en.ore); }
          if(SHOW_LAV && en.lavorazione){ chunks.push(en.lavorazione); }

          let line = en.orari || "";
          const nt = (en.note||"").trim();
          if (nt && nt !== "-" && nt !== "—" && nt !== "." && nt !== "·" && nt !== line.trim()){
            line = line ? (line + " — " + nt) : nt;
          }
          if(line) chunks.push(line);

          parts.push(chunks.join("\n"));
        });
        if(entries.length>1){ parts.push(`Tot: ${(+total.toFixed(2)).toString()} h`); }
        line.push(parts.join("\n\n"));
      }
      rows.push(line);
    });
    return rows;
  }

  function sheetXML(name, rows){
    const colCount = rows[0]?.length || 1;
    let cols = "";
    for(let i=0;i<colCount;i++){
      const w = i===0 ? 160 : 80;
      cols += `<Column ss:Width="${w}"/>`;
    }
    const lines = rows.map((r,ri)=>{
      const cells = r.map((c)=>{
        const text = xmlEscape(c==null?"":String(c));
        return `<Cell${ri===0?` ss:StyleID="hdr"`:""}><Data ss:Type="String">${text}</Data></Cell>`;
      }).join("");
      return `<Row>${cells}</Row>`;
    }).join("");
    return `<Worksheet ss:Name="${xmlEscape(name)}"><Table>${cols}${lines}</Table></Worksheet>`;
  }

  function exportExcel(){
    if(!cache.Y || !cache.M){
      alert("Carica prima un mese.");
      return;
    }

    statusEl.innerHTML = '<span class="ok">⏳ Generazione Excel...</span>';

    const dataA = buildMatrix(1,15);
    const dataB = buildMatrix(16,31);

    const now = new Date().toISOString();
    const xml =
`<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <DocumentProperties xmlns="urn:schemas-microsoft-com:office:office">
  <Author>Presenze Cantiere</Author>
  <Created>${now}</Created>
 </DocumentProperties>
 <ExcelWorkbook xmlns="urn:schemas-microsoft-com:office:excel">
  <ProtectStructure>False</ProtectStructure>
  <ProtectWindows>False</ProtectWindows>
 </ExcelWorkbook>
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
    <Alignment ss:Vertical="Top" ss:WrapText="1"/>
    <Borders/>
    <Font ss:FontName="Calibri" ss:Size="11"/>
    <Interior/>
    <NumberFormat/>
    <Protection/>
  </Style>
  <Style ss:ID="hdr">
    <Font ss:Bold="1"/>
    <Alignment ss:Horizontal="Center" ss:Vertical="Center"/>
    <Interior ss:Color="#EEEEEE" ss:Pattern="Solid"/>
  </Style>
 </Styles>
 ${sheetXML("Giorni 1–15", dataA)}
 ${sheetXML("Giorni 16–31", dataB)}
</Workbook>`;

    const blob = new Blob([xml], {type: "application/vnd.ms-excel"});
    const [Y,M] = [cache.Y, cache.M];
    const fname = `Presenze_${Y}-${pad(M)}.xls`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);

    statusEl.innerHTML = '<span class="ok">✓ Excel esportato con successo!</span>';
    setTimeout(() => statusEl.textContent = '', 3000);
  }

  /* ============ INIT ============ */
  (function init(){
    if(!supportsMonth){
      document.getElementById("mese").classList.add('hidden');
      document.getElementById("meseFallback").classList.remove('hidden');
    }
    const now = new Date();
    populateYearSelect(now.getFullYear());
    const Y = now.getFullYear();
    const M = now.getMonth()+1;
    setYM(Y,M,true);

    document.getElementById("btnCarica").addEventListener("click", carica);
    document.getElementById("prevMonth").addEventListener("click", ()=>shiftMonth(-1));
    document.getElementById("nextMonth").addEventListener("click", ()=>shiftMonth(+1));
    document.getElementById("btnPDF").addEventListener("click", exportPDF);
    document.getElementById("btnXLS").addEventListener("click", exportExcel);

    const meseInputEl = document.getElementById("mese");
    meseInputEl.addEventListener("change", ()=>{
      const v = meseInputEl.value;
      if(v && /^\d{4}-\d{2}$/.test(v)){
        const [y,m] = v.split('-').map(Number);
        setYM(y,m,true);
      }
    });
    selMese.addEventListener("change", ()=>setYM(Number(selAnno.value), Number(selMese.value), false));
    selAnno.addEventListener("change", ()=>setYM(Number(selAnno.value), Number(selMese.value), false));

    carica();
  })();
  </script>
